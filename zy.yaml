# ==================== 锚点配置 ====================
BaseProvider: &BaseProvider {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.google.com/generate_204', interval: 300}, filter: '^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'}
BaseUT: &BaseUT {type: url-test, interval: 600, lazy: true, url: 'https://www.google.com/generate_204'}

# 节点筛选正则表达式
FilterHK: &FilterHK '^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG))(?!.*(排除1|排除2|5x)).*$'
FilterSG: &FilterSG '^(?=.*(?i)(坡|🇸🇬|SG|Sing|SIN|XSP))(?!.*(排除1|排除2|5x)).*$'
FilterJP: &FilterJP '^(?=.*(?i)(日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK))(?!.*(排除1|排除2|5x)).*$'
FilterKR: &FilterKR '^(?=.*(?i)(韩|🇰🇷|韓|首尔|南朝鲜|KR|KOR|Korea|South))(?!.*(排除1|排除2|5x)).*$'
FilterUS: &FilterUS '^(?=.*(?i)(美|🇺🇸|US|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD))(?!.*(排除1|排除2|5x)).*$'
FilterTW: &FilterTW '^(?=.*(?i)(台|🇼🇸|🇹🇼|TW|tai|TPE|TSA|KHH))(?!.*(排除1|排除2|5x)).*$'

SelectAI: &SelectAI   {type: select, proxies: [台湾自动, 日本自动, 狮城自动, 韩国自动, 美国自动]}
SelectOne: &SelectOne {type: select, proxies: [DIRECT, 香港自动, 台湾自动, 日本自动, 狮城自动, 韩国自动, 美国自动]}
SelectFollowGlobal: &SelectFollowGlobal {type: select, proxies: [DIRECT, 全球代理, 香港自动, 台湾自动, 日本自动, 狮城自动, 韩国自动, 美国自动]}

# ==================== 代理提供者 ====================
proxy-providers:
  悦通: {<<: *BaseProvider, url: 'https://xn--9kqs1lo79d.cc/api/v1/chuixue?token=56aa83f64f806bdf830e1b83de92f1c0'}
  良心云: {<<: *BaseProvider, url: 'https://liangxin.xyz/api/v1/liangxin?OwO=67d2b668cb92e546076213a6fa86de82'}
  吹雪云: {<<: *BaseProvider, url: 'https://sso.yuetoto.com/api/v2/avatar/6902e65e642ebceee3e345bd01eeb44c'}

# ==================== 核心配置 ====================
mode: rule
port: 7890
socks-port: 7891
mixed-port: 7893
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'always'

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# ==================== 代理策略组 ====================
proxy-groups:
  - {name: 全球代理,  <<: *SelectOne}
  - {name: EMBY,  <<: *SelectOne}
  - {name: 电报平台,  <<: *SelectFollowGlobal}
  - {name: 海外媒体,  <<: *SelectFollowGlobal}
  - {name: 智能助理,  <<: *SelectAI}  
  - {name: 谷歌服务,  <<: *SelectFollowGlobal}
  - {name: 微软服务,  <<: *SelectFollowGlobal}
  
  - {name: 香港自动,  <<: *BaseUT, filter: *FilterHK, use: [吹雪云, 悦通, 良心云]}
  - {name: 台湾自动,  <<: *BaseUT, filter: *FilterTW, use: [吹雪云, 悦通, 良心云]}
  - {name: 日本自动,  <<: *BaseUT, filter: *FilterJP, use: [吹雪云, 悦通, 良心云]}
  - {name: 狮城自动,  <<: *BaseUT, filter: *FilterSG, use: [吹雪云, 悦通, 良心云]}
  - {name: 韩国自动,  <<: *BaseUT, filter: *FilterKR, use: [吹雪云, 悦通, 良心云]}
  - {name: 美国自动,  <<: *BaseUT, filter: *FilterUS, use: [吹雪云, 悦通, 良心云]}
  
# ==================== 规则路由 ====================
rules: 
  - RULE-SET,AI,智能助理
  - RULE-SET,EMBY,EMBY
  - RULE-SET,Telegram,电报平台
  - RULE-SET,YouTube,海外媒体
  - RULE-SET,Google,谷歌服务
  - RULE-SET,Microsoft,微软服务
  - RULE-SET,Proxy,全球代理
  - RULE-SET,China,DIRECT
  - MATCH,全球代理

# ==================== 规则集 ====================
BehaviorDN: &BehaviorDN {type: http, behavior: domain, format: mrs, interval: 86400}
rule-providers: 
  AI:         {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/AI.mrs}
  EMBY:       {type: http, behavior: classical, format: text, url: "https://raw.githubusercontent.com/hiknn/rule/refs/heads/main/QuanX/Emby", interval: 86400}
  Telegram:   {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Telegram.mrs}
  YouTube:    {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/YouTube.mrs}
  Google:     {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Google.mrs}
  Microsoft:  {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Microsoft.mrs}  
  Proxy:      {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Proxy.mrs}
  China:      {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/China.mrs}
